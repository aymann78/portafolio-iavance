<script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),preserveDrawingBuffer:true});r.setSize(1280,720);r.setPixelRatio(1);
const sc=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uRes:{value:new THREE.Vector2(1280,720)},uT:{value:0},uN:{value:1},uF:{value:[new THREE.Vector4(),new THREE.Vector4(),new THREE.Vector4()]},uG:{value:[new THREE.Vector4(),new THREE.Vector4(),new THREE.Vector4()]}};
const frag=`precision highp float;uniform vec2 uRes;uniform float uT;uniform int uN;uniform vec4 uF[3];uniform vec4 uG[3];
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p*=2.02;a*=.5;}return s;}
vec3 flame(vec2 q,vec4 F,vec4 G,float t){
  float lean=G.x,fl=G.y,wsc=G.w,inten=F.w;vec2 p=q;
  p.x-=lean*p.y*p.y;
  float n=fbm(vec2(p.x*3.,p.y*2.5-t*1.8)),n2=fbm(vec2(p.x*5.+7.,p.y*3.5-t*2.6));
  p.x+=(n-.5)*fl*.6*smoothstep(0.,1.,p.y);
  float h=1.+(n2-.5)*fl*.3,y=p.y/h;
  float yc=.24,R=wsc*.27;float yy=clamp(y,0.,1.);float w=yy<yc?R*sqrt(max(0.,1.-pow((yc-yy)/yc,2.))):R*pow(clamp(1.-(yy-yc)/(1.-yc),0.,1.),.9);
  float d=abs(p.x)-w;
  float inside=smoothstep(.008,-.012,d)*step(0.,p.y)*step(p.y,h);
  float glow=exp(-max(d,0.)*7.)*.32*smoothstep(1.2,0.,p.y)*step(-.05,p.y);
  vec3 col=mix(vec3(1.,.32,.04),vec3(.85,.08,.02),y);
  col=mix(col,vec3(1.,.72,.18),smoothstep(0.,-.10,d)*(1.-y*.7));
  col=mix(col,vec3(1.,.97,.82),pow(smoothstep(0.,-.2,d),2.)*(1.-y)*1.2);
  col=mix(col,vec3(.25,.45,1.),smoothstep(.14,0.,p.y)*smoothstep(.02,-.05,d)*.55);
  col*=mix(vec3(1.,.5,.22),vec3(1.),smoothstep(.25,.85,inten));
  vec3 res=col*(inside+glow*.9)*inten*1.5;
  // chispas
  for(int i=0;i<26;i++){float fi=float(i),s=hash(vec2(fi,1.));if(fi/26.>inten*inten)continue;
    float ph=fract(t*(.18+s*.3)+s*9.);float x=(hash(vec2(fi,2.))-.5)*.5+sin(t*2.+fi)*.05*ph+lean*ph*ph*.8;float yy=ph*(1.15+s*.9);
    vec2 dd=(q-vec2(x,yy))*vec2(1.,1.);float rad=.011*(1.-ph)*(.6+s);res+=vec3(1.,.62,.2)*exp(-dot(dd,dd)/(rad*rad))*(1.-ph)*inten*1.3;}
  // humo
  if(G.z>0.){vec2 s=vec2(q.x-lean*.3-(fbm(vec2(q.y*1.5,t*.4))-.5)*.5*q.y,q.y-1.05);float band=smoothstep(.0,.12,s.y)*smoothstep(1.5,.2,s.y);float wd=.07+.1*s.y;
    float m=smoothstep(wd,0.,abs(s.x))*band*fbm(vec2(s.x*4.,s.y*3.-t*.6));res+=vec3(.5,.55,.66)*m*G.z*.8;}
  return res;}
void main(){vec2 uv=gl_FragCoord.xy;vec3 col=vec3(.008,.010,.018)+vec3(.012,.014,.03)*(uv.y/uRes.y);
  for(int i=0;i<3;i++){if(i>=uN)break;vec2 base=uF[i].xy*uRes;float hp=uF[i].z*uRes.y;vec2 q=(uv-base)/hp;
    vec2 gq=(uv-base-vec2(0.,hp*.45))/(hp*1.5);col+=vec3(1.,.42,.1)*exp(-dot(gq,gq)*2.2)*.34*uF[i].w*uF[i].w;
    float fl=exp(-pow((uv.y-(base.y-hp*.06))/(hp*.07),2.))*exp(-pow((uv.x-base.x)/(hp*.9),2.));
    col+=flame(q,uF[i],uG[i],uT+float(i)*3.7);}
  col=1.-exp(-col*1.25);vec2 v=uv/uRes-.5;col*=1.-dot(v,v)*.9;col+=(hash(uv+uT)-.5)*.02;gl_FragColor=vec4(pow(col,vec3(.95)),1.);}`;
sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:U,vertexShader:'void main(){gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:frag})));
window.setup=(cfg)=>{U.uT.value=cfg.t||2.3;U.uN.value=cfg.f.length;cfg.f.forEach((f,i)=>{U.uF.value[i].set(f.x,f.y,f.h,f.i);U.uG.value[i].set(f.lean||0,f.fl||.6,f.smoke||0,f.w||1)});
  document.getElementById('o').innerHTML=cfg.html||'';r.render(sc,cam);return true};

</script>
