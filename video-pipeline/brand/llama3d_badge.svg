  <feComposite in="dark" in2="SourceAlpha" operator="in" result="dark2"/>
  <feMerge><feMergeNode in="lit2"/><feMergeNode in="warm2"/><feMergeNode in="dark2"/><feMergeNode in="spec2"/></feMerge>
</filter>
